spring.application.name=livraria
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/livraria;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Evita a conversão via java.sql.Date, que desloca datas anteriores a 1914 no fuso America/Sao_Paulo
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true

spring.jackson.time-zone=America/Sao_Paulo

livraria.admin.email=admin@livraria.com
livraria.admin.senha=admin123
livraria.auth.duracao-sessao=PT8H
