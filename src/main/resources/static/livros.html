<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros | Livraria Páginas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="cabecalho" class="cabecalho"></header>

<main class="conteudo">
    <h1>Catálogo de livros</h1>
    <div id="mensagem" class="mensagem" role="alert"></div>

    <div class="grade">
        <section class="cartao">
            <h2 id="tituloFormulario">Novo livro</h2>
            <form id="formulario" novalidate>
                <div class="campo">
                    <label for="titulo">Título</label>
                    <input id="titulo" name="titulo" maxlength="150" required>
                </div>
                <div class="campo">
                    <label for="autor">Autor</label>
                    <input id="autor" name="autor" maxlength="100" required>
                </div>
                <div class="linhaCampos">
                    <div class="campo">
                        <label for="isbn">ISBN</label>
                        <input id="isbn" name="isbn" inputmode="numeric" maxlength="13" placeholder="Somente números" required>
                    </div>
                    <div class="campo">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" name="categoria" required></select>
                    </div>
                </div>
                <div class="linhaCampos">
                    <div class="campo">
                        <label for="preco">Preço (R$)</label>
                        <input id="preco" name="preco" type="number" min="0.01" step="0.01" required>
                    </div>
                    <div class="campo">
                        <label for="quantidadeEstoque">Estoque</label>
                        <input id="quantidadeEstoque" name="quantidadeEstoque" type="number" min="0" step="1" required>
                    </div>
                </div>
                <div class="campo">
                    <label for="dataPublicacao">Data de publicação</label>
                    <input id="dataPublicacao" name="dataPublicacao" type="date">
                </div>
                <div class="acoesFormulario">
                    <button id="btnSalvar" class="botao botaoPrimario" type="submit">Salvar</button>
                    <button id="btnCancelar" class="botao botaoSecundario" type="button">Limpar</button>
                </div>
            </form>
        </section>

        <section class="cartao">
            <div class="topoTabela">
                <h2>Livros cadastrados</h2>
                <input id="campoBusca" type="search" placeholder="Buscar por título ou autor">
            </div>
            <table id="tabela">
                <thead>
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>ISBN</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Publicação</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </div>
</main>

<script type="module" src="/js/livros.js"></script>
</body>
</html>
