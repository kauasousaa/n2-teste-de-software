<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Livraria Páginas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="paginaLogin">
<main class="cartao cartaoLogin">
    <h1>📚 Livraria Páginas</h1>
    <p class="subtitulo">Acesse o sistema de vendas</p>

    <div id="mensagem" class="mensagem" role="alert"></div>

    <form id="formLogin" novalidate>
        <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="username" required>
        </div>
        <div class="campo">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" placeholder="Sua senha" autocomplete="current-password" required>
        </div>
        <button id="btnEntrar" class="botao botaoPrimario" type="submit">Entrar</button>
    </form>

    <p class="dica">Usuário padrão: <strong>admin@livraria.com</strong> / <strong>admin123</strong></p>
</main>

<script type="module" src="/js/login.js"></script>
</body>
</html>
